name: Engineering task
description: Propose a bounded, reviewable product or infrastructure change.
title: "[Engineering]: "
labels: [engineering]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What user or operational problem should this solve?
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use testable bullet points.
    validations: { required: true }
  - type: textarea
    id: tests
    attributes:
      label: Tests and validation
      description: List automated and manual checks.
    validations: { required: true }
  - type: textarea
    id: security
    attributes:
      label: Security, privacy, and editorial impact
      description: Consider personal data, tactical information, source evidence, permissions, and publication controls.
    validations: { required: true }
  - type: textarea
    id: rollback
    attributes:
      label: Rollback plan
      description: Explain how to reverse the change safely.
    validations: { required: true }
